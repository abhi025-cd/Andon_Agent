[project]
name = "andon-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.3",
    "langchain-core>=1.6.6",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.12",
    "numpy>=2.5.3",
    "paho-mqtt>=2.1.0",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
